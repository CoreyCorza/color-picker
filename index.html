<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color picker</title>
    <link rel="stylesheet" href="color-picker.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 1.5rem;
        font-family: system-ui, sans-serif;
        background: #272727;
        color: #ddd;
      }
      .swatch {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        cursor: pointer;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      button.pick {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #1a1a1a;
        color: inherit;
        cursor: pointer;
      }
      output {
        font-family: Consolas, monospace;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <div id="swatch" class="swatch" title="Click to pick"></div>
    </div>
    <script type="module" src="demo.js"></script>
  </body>
</html>
